<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="永瀬廉NEWS">
    <link rel="apple-touch-icon" href="icon.png">
    <title>永瀬廉NEWS</title>
    <style>
        :root {
            --main-bg: #0f0f0f;
            --card-bg: #1e1e1e;
            --accent-color: #d4af37;
            --text-color: #f5f5f5;
            --sub-text: #b0b0b0;
            --new-badge: #ff4500;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--main-bg);
            color: var(--text-color);
            margin: 0; padding: 20px;
            display: flex; justify-content: center;
        }
        .container { width: 100%; max-width: 500px; }
        h1 {
            font-size: 20px; text-align: center;
            color: var(--accent-color); margin-bottom: 20px;
            letter-spacing: 3px; font-weight: normal;
        }
        .search-container { margin-bottom: 20px; }
        #search-bar {
            width: 100%; padding: 12px 20px; border-radius: 25px;
            border: 1px solid #333; background: #222; color: white;
            font-size: 16px; outline: none; box-sizing: border-box;
        }
        .section-title {
            font-size: 14px; color: var(--sub-text);
            margin: 25px 0 10px 5px; border-left: 2px solid var(--accent-color);
            padding-left: 10px;
        }
        #news-list { display: grid; gap: 12px; }
        .news-item {
            background: var(--card-bg); padding: 15px;
            border-radius: 10px; position: relative;
        }
        .date-row { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
        .date { font-size: 11px; color: var(--sub-text); font-weight: bold; }
        .new-badge {
            background: var(--new-badge); color: white;
            font-size: 9px; padding: 2px 6px; border-radius: 4px; font-weight: bold;
        }
        .news-item a {
            color: var(--text-color); text-decoration: none;
            font-size: 15px; font-weight: 600; line-height: 1.4;
        }
        /* アーカイブボタン */
        .archive-buttons { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
        .year-btn {
            background: #222; color: var(--accent-color); border: 1px solid var(--accent-color);
            padding: 8px 15px; border-radius: 20px; font-size: 13px; cursor: pointer;
        }
        .year-btn.active { background: var(--accent-color); color: black; }
    </style>
</head>
<body>
    <div class="container">
        <h1>永瀬廉 NEWS</h1>
        
        <div class="search-container">
            <input type="text" id="search-bar" placeholder="記事を検索...">
        </div>

        <div id="display-area">
            <div class="section-title" id="list-title">最新の30件</div>
            <div id="news-list">読み込み中...</div>
        </div>

        <div class="section-title">年別アーカイブ</div>
        <div class="archive-buttons" id="year-buttons"></div>
    </div>

    <script>
        let allNews = [];
        let latestDate = "";

        function renderNews(items, title) {
            document.getElementById('list-title').innerText = title;
            const list = document.getElementById('news-list');
            list.innerHTML = '';
            
            items.forEach(item => {
                const isNew = item.date === latestDate;
                const div = document.createElement('div');
                div.className = 'news-item';
                div.innerHTML = `
                    <div class="date-row">
                        <span class="date">${item.date}</span>
                        ${isNew ? '<span class="new-badge">NEW</span>' : ''}
                    </div>
                    <a href="${item.url}" target="_blank">${item.title}</a>
                `;
                list.appendChild(div);
            });
        }

        fetch('news.json')
            .then(res => res.json())
            .then(data => {
                allNews = data;
                if(data.length > 0) {
                    latestDate = data[0].date;
                    // 最新30件を表示
                    renderNews(allNews.slice(0, 30), "最新の30件");
                    
                    // 年別ボタン生成
                    const years = [...new Set(data.map(n => n.year))];
                    const btnContainer = document.getElementById('year-buttons');
                    years.forEach(year => {
                        const btn = document.createElement('button');
                        btn.className = 'year-btn';
                        btn.innerText = year + '年';
                        btn.onclick = () => {
                            const filtered = allNews.filter(n => n.year === year);
                            renderNews(filtered, year + "年のアーカイブ (" + filtered.length + "件)");
                            window.scrollTo(0, 0);
                        };
                        btnContainer.appendChild(btn);
                    });
                }
            });

        document.getElementById('search-bar').addEventListener('input', (e) => {
            const word = e.target.value.toLowerCase();
            const filtered = allNews.filter(n => n.title.toLowerCase().includes(word));
            renderNews(filtered, "検索結果: " + filtered.length + "件");
        });
    </script>
</body>
</html>
