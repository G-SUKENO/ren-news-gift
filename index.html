<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>REN NAGASE PORTAL</title>
    <style>
        :root { --bg-color: #000; --card-bg: #111; --accent-color: #d4af37; --text-color: #fff; }
        body { 
            font-family: -apple-system, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            margin: 0; padding: 0; 
            overflow-x: hidden;
            overscroll-behavior-y: contain;
        }
        
        /* 更新インジケーター */
        #ptr-loader { height: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; background: #000; transition: height 0.2s ease; }
        .spinner { width: 22px; height: 22px; border: 2px solid rgba(212, 175, 55, 0.3); border-top: 2px solid var(--accent-color); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* ヘッダー：写真の上に重ねるスタイル */
        header { 
            padding: 40px 15px 20px; 
            text-align: center; 
            position: relative;
            z-index: 10;
        }
        .subtitle { font-size: 0.6rem; color: var(--accent-color); letter-spacing: 0.4rem; text-transform: uppercase; margin-bottom: 10px; opacity: 0.9; font-weight: 400; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        h1 { margin: 0; font-size: 1.4rem; color: var(--accent-color); letter-spacing: 0.25rem; font-weight: bold; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        
        /* 💡 全画面（ヒーロー）フォトエリア */
        .hero-container {
            width: 100%;
            height: 65vh; /* 画面の約65%を占める巨大表示 */
            position: relative;
            margin-top: -120px; /* ヘッダーの下に潜り込ませる */
            overflow: hidden;
        }
        #random-photo {
            width: 100%;
            height: 100%;
            object-fit: cover; /* 隙間なく全画面表示 */
            display: block;
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
        }
        /* 写真の下に黒いグラデーションを入れてメニューに繋げる */
        .hero-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40%;
            background: linear-gradient(to top, #000, transparent);
        }

        /* 2段メニュー */
        .sns-hub { display: grid; padding: 20px 5px; border-bottom: 1px solid #222; gap: 18px 0; background: #000; position: relative; z-index: 20; }
        @media (max-width: 600px) { .sns-hub { grid-template-columns: repeat(3, 1fr); } }
        @media (min-width: 601px) { .sns-hub { grid-template-columns: repeat(6, 1fr); } }

        .sns-item { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: #fff; }
        .sns-icon { width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--accent-color); display: flex; justify-content: center; align-items: center; font-size: 0.5rem; margin-bottom: 8px; color: var(--accent-color); background: var(--card-bg); box-shadow: 0 4px 15px rgba(212,175,55,0.2); }
        .sns-label { font-size: 0.55rem; font-weight: bold; }

        /* セクション */
        .section-label { padding: 25px 15px 5px; font-size: 0.75rem; color: var(--accent-color); font-weight: bold; border-left: 3px solid var(--accent-color); margin: 15px 0 0 15px; text-transform: uppercase; letter-spacing: 0.1rem; }

        .featured-video { padding: 12px; }
        .v-main { position: relative; padding-bottom: 56.25%; height: 0; border-radius: 12px; overflow: hidden; border: 1px solid #333; }
        .v-main iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        
        .video-scroll { display: flex; overflow-x: auto; padding: 10px 15px; gap: 12px; }
        .video-scroll::-webkit-scrollbar { display: none; }
        .v-card { min-width: 150px; text-decoration: none; color: #fff; }
        .v-thumb { width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 8px; border: 1px solid #222; }
        
        #news-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; padding: 12px; }
        .news-card { background: var(--card-bg); border-radius: 10px; overflow: hidden; text-decoration: none; color: inherit; border: 1px solid #222; }
        .news-img { width: 100%; aspect-ratio: 16/10; object-fit: cover; }
        .news-content { padding: 12px; }
        .news-source { font-size: 0.6rem; color: var(--accent-color); font-weight: bold; margin-bottom: 5px; }
        .news-title { font-size: 0.8rem; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    </style>
</head>
<body>
    <div id="ptr-loader"><div class="spinner"></div></div>

    <div id="main-content">
        <header>
            <div class="subtitle">T.Miku Only</div>
            <h1>REN NAGASE PORTAL</h1>
        </header>

        <div class="hero-container">
            <img id="random-photo" src="" alt="Ren Nagase">
            <div class="hero-overlay"></div>
        </div>
        
        <div class="sns-hub">
            <a href="https://www.universal-music.co.jp/king-and-prince/" class="sns-item" target="_blank"><div class="sns-icon">OFFICIAL</div><div class="sns-label">Official</div></a>
            <a href="https://starto.jp/s/p/artist/41" class="sns-item" target="_blank"><div class="sns-icon">START</div><div class="sns-label">Schedule</div></a>
            <a href="https://www.youtube.com/@kp_official_523" class="sns-item" target="_blank"><div class="sns-icon">YOUTUBE</div><div class="sns-label">YouTube</div></a>
            <a href="https://www.instagram.com/ren.nagase.official/" class="sns-item" target="_blank"><div class="sns-icon">INSTA</div><div class="sns-label">Instagram</div></a>
            <a href="https://x.com/kp_official0523" class="sns-item" target="_blank"><div class="sns-icon">X</div><div class="sns-label">X</div></a>
            <a href="https://www.tiktok.com/@kp_official_523" class="sns-item" target="_blank"><div class="sns-icon">TIKTOK</div><div class="sns-label">TikTok</div></a>
        </div>

        <div class="section-label">Featured Movie</div>
        <div class="featured-video" id="main-video"></div>
        <div class="section-label">New Arrivals</div>
        <div class="video-scroll" id="video-list"></div>
        <div class="section-label">Latest News</div>
        <div id="news-container"></div>
    </div>

    <script>
        async function loadData() {
            try {
                const res = await fetch('news.json?v=' + Date.now());
                const data = await res.json();
                
                // 1. ランダムフォト（全画面）
                if (data.images && data.images.length > 0) {
                    const randomIndex = Math.floor(Math.random() * data.images.length);
                    const photoEl = document.getElementById('random-photo');
                    photoEl.style.opacity = 0;
                    photoEl.src = data.images[randomIndex] + '?v=' + Date.now();
                    photoEl.onload = () => { photoEl.style.opacity = 1; };
                }

                // 2. 動画セクション
                const allVideos = [...(data.featured ? [data.featured] : []), ...(data.regulars || []), ...(data.shorts || [])];
                if(allVideos.length > 0) {
                    document.getElementById('main-video').innerHTML = `<div class="v-main"><iframe src="https://www.youtube.com/embed/${allVideos[0].id}" frameborder="0" allowfullscreen></iframe></div>`;
                    const list = document.getElementById('video-list');
                    list.innerHTML = "";
                    allVideos.slice(1).forEach(v => {
                        list.innerHTML += `<a href="https://www.youtube.com/watch?v=${v.id}" class="v-card" target="_blank"><img src="${v.thumbnail}" class="v-thumb"><div style="font-size:0.6rem;padding:8px 0">${v.title}</div></a>`;
                    });
                }

                // 3. ニュースセクション
                const container = document.getElementById('news-container');
                container.innerHTML = "";
                (data.news || []).forEach(item => {
                    container.innerHTML += `<a href="${item.url}" class="news-card" target="_blank"><img src="${item.img || ''}" class="news-img"><div class="news-content"><div class="news-source">${item.source}</div><div class="news-title">${item.title}</div></div></a>`;
                });
            } catch (e) { console.error("Load error", e); }
        }

        // Pull-to-Refresh
        let startY = 0;
        const loader = document.getElementById('ptr-loader');
        window.addEventListener('touchstart', (e) => { if (window.scrollY === 0) startY = e.touches[0].pageY; }, { passive: true });
        window.addEventListener('touchmove', (e) => {
            const y = e.touches[0].pageY;
            const dist = y - startY;
            if (window.scrollY === 0 && dist > 0 && dist < 100) loader.style.height = dist + 'px';
        }, { passive: true });
        window.addEventListener('touchend', async (e) => {
            if (parseInt(loader.style.height) > 60) {
                loader.style.height = '40px';
                await loadData();
                setTimeout(() => { loader.style.height = '0'; }, 500);
            } else { loader.style.height = '0'; }
        }, { passive: true });

        loadData();
    </script>
</body>
</html>
