<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="icon.png">
    <title>永瀬廉NEWS</title>
    <style>
        :root { --main-bg: #0d0d0d; --card-bg: #1a1a1a; --accent: #d4af37; --text: #ffffff; }
        * { box-sizing: border-box; }
        body { font-family: -apple-system, sans-serif; background: var(--main-bg); color: var(--text); margin: 0; padding: 16px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 480px; }
        h1 { font-size: 18px; text-align: center; color: var(--accent); letter-spacing: 4px; margin: 10px 0 20px; font-weight: 300; }
        #search-bar { width: 100%; padding: 14px 20px; border-radius: 30px; border: 1px solid #333; background: #222; color: white; margin-bottom: 20px; outline: none; font-size: 16px; appearance: none; }
        .news-item { background: var(--card-bg); border-radius: 15px; margin-bottom: 12px; display: flex; height: 95px; text-decoration: none; color: inherit; overflow: hidden; border: 1px solid #252525; }
        .news-img { width: 95px; height: 95px; object-fit: cover; background: #222; flex-shrink: 0; }
        .news-content { padding: 12px; display: flex; flex-direction: column; justify-content: space-between; flex-grow: 1; min-width: 0; }
        .news-title { font-size: 14px; font-weight: 600; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .meta-row { display: flex; gap: 8px; align-items: center; }
        .source-tag { font-size: 10px; color: var(--accent); font-weight: bold; border: 0.5px solid var(--accent); padding: 1px 6px; border-radius: 4px; }
        .date { font-size: 10px; color: #888; }
        .new-badge { background: #ff4500; color: white; font-size: 9px; padding: 1px 5px; border-radius: 4px; font-weight: bold; }
        .year-btn { background: #1a1a1a; color: var(--accent); border: 1px solid var(--accent); padding: 7px 16px; border-radius: 20px; font-size: 12px; margin: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h1>永瀬廉 NEWS</h1>
        <input type="text" id="search-bar" placeholder="キーワードで探す">
        <div id="news-list"></div>
        <div id="year-buttons" style="margin-top:30px; text-align:center;"></div>
    </div>
    <script>
        const placeholder = "https://placehold.jp/24/1a1a1a/d4af37/150x150.png?text=%E2%98%85";
        let allNews = [];

        function renderNews(items) {
            const list = document.getElementById('news-list');
            list.innerHTML = '';
            if (items.length === 0) return;
            const latestDate = items[0].date;
            items.forEach(item => {
                const a = document.createElement('a');
                a.className = 'news-item'; a.href = item.url; a.target = '_blank';
                
                // ★ メディア名のガード: undefined なら 'News' と出す
                const source = (item.source && item.source !== 'undefined') ? item.source : 'News';
                
                // ★ 画像のガード: Googleリンクなら星マーク
                const imgSrc = (item.img && item.img.includes('http') && !item.img.includes('google')) ? item.img : placeholder;
                
                a.innerHTML = `<img src="${imgSrc}" onerror="this.src='${placeholder}'" class="news-img">
                    <div class="news-content">
                        <div class="news-title">${item.title}</div>
                        <div class="meta-row">
                            <span class="date">${item.date}</span>
                            <span class="source-tag">${source}</span>
                            ${item.date === latestDate ? '<span class="new-badge">NEW</span>' : ''}
                        </div>
                    </div>`;
                list.appendChild(a);
            });
        }

        fetch('news.json?t=' + Date.now()).then(res => res.json()).then(data => {
            allNews = data;
            renderNews(allNews.slice(0, 30));
            [...new Set(data.map(n => n.year))].sort().reverse().forEach(year => {
                const btn = document.createElement('button');
                btn.className = 'year-btn'; btn.innerText = year + '年';
                btn.onclick = () => renderNews(allNews.filter(n => n.year === year));
                document.getElementById('year-buttons').appendChild(btn);
            });
        });
        document.getElementById('search-bar').addEventListener('input', (e) => {
            const word = e.target.value.toLowerCase();
            renderNews(allNews.filter(n => n.title.toLowerCase().includes(word)).slice(0, 30));
        });
    </script>
</body>
</html>
