<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>REN NAGASE PORTAL</title>
    <style>
        :root { --bg-color: #000; --card-bg: #111; --accent-color: #d4af37; --text-color: #fff; }
        body { 
            font-family: -apple-system, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            margin: 0; padding: 0; 
            overflow-x: hidden;
            overscroll-behavior-y: contain;
        }
        
        /* 更新インジケーター */
        #ptr-loader { height: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; background: #000; transition: height 0.2s ease; }
        .spinner { width: 20px; height: 20px; border: 2px solid rgba(212, 175, 55, 0.3); border-top: 2px solid var(--accent-color); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* ヘッダー */
        header { padding: 30px 15px 15px; text-align: center; }
        .subtitle { font-size: 0.6rem; color: var(--accent-color); letter-spacing: 0.3rem; text-transform: uppercase; margin-bottom: 8px; opacity: 0.8; font-weight: 300; }
        h1 { margin: 0; font-size: 1.2rem; color: var(--accent-color); letter-spacing: 0.2rem; font-weight: bold; }
        
        /* ランダムフォトフレーム */
        .photo-frame { width: 85%; margin: 10px auto 25px; padding: 3px; background: linear-gradient(45deg, #000, var(--accent-color), #000); border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        #random-photo { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; border-radius: 12px; display: block; background: #111; opacity: 0; transition: opacity 0.5s ease; }

        /* 2段メニュー */
        .sns-hub { display: grid; padding: 15px 5px; border-bottom: 1px solid #222; gap: 15px 0; background: #000; }
        @media (max-width: 600px) { .sns-hub { grid-template-columns: repeat(3, 1fr); } }
        @media (min-width: 601px) { .sns-hub { grid-template-columns: repeat(6, 1fr); } }

        .sns-item { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: #fff; }
        .sns-icon { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--accent-color); display: flex; justify-content: center; align-items: center; font-size: 0.5rem; margin-bottom: 6px; color: var(--accent-color); background: var(--card-bg); box-shadow: 0 0 10px rgba(212,175,55,0.15); }
        .sns-label { font-size: 0.55rem; font-weight: bold; }

        /* セクションラベル */
        .section-label { padding: 15px 15px 5px; font-size: 0.7rem; color: var(--accent-color); font-weight: bold; border-left: 3px solid var(--accent-color); margin: 15px 0 0 15px; text-transform: uppercase; }

        /* 動画セクション */
        .featured-video { padding: 12px; }
        .v-main { position: relative; padding-bottom: 56.25%; height: 0; border-radius: 12px; overflow: hidden; border: 1px solid #333; }
        .v-main iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        
        .video-scroll { display: flex; overflow-x: auto; padding: 10px 15px; gap: 12px; }
        .video-scroll::-webkit-scrollbar { display: none; }
        .v-card { min-width: 140px; text-decoration: none; color: #fff; }
        .v-thumb { width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 8px; border: 1px solid #222; }
        .v-title { font-size: 0.6rem; margin-top: 5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.3; }
        
        /* ニュースセクション */
        #news-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; padding: 12px; }
        .news-card { background: var(--card-bg); border-radius: 8px; overflow: hidden; text-decoration: none; color: inherit; border: 1px solid #222; }
        .news-img { width: 100%; aspect-ratio: 16/10; object-fit: cover; background: #222; }
        .news-content { padding: 10px; }
        .news-source { font-size: 0.55rem; color: var(--accent-color); font-weight: bold; }
        .news-title { font-size: 0.75rem; line-height: 1.3; margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    </style>
</head>
<body>
    <div id="ptr-loader"><div class="spinner"></div></div>

    <div id="main-content">
        <header>
            <div class="subtitle">T.Miku Only</div>
            <h1>REN NAGASE PORTAL</h1>
        </header>

        <div class="photo-frame">
            <img id="random-photo" src="" alt="Ren Nagase">
        </div>
        
        <div class="sns-hub">
            <a href="https://www.universal-music.co.jp/king-and-prince/" class="sns-item" target="_blank"><div class="sns-icon">OFFICIAL</div><div class="sns-label">Official</div></a>
            <a href="https://starto.jp/s/p/artist/41" class="sns-item" target="_blank"><div class="sns-icon">START</div><div class="sns-label">Schedule</div></a>
            <a href="https://www.youtube.com/@kp_official_523" class="sns-item" target="_blank"><div class="sns-icon">YOUTUBE</div><div class="sns-label">YouTube</div></a>
            <a href="https://www.instagram.com/ren.nagase.official/" class="sns-item" target="_blank"><div class="sns-icon">INSTA</div><div class="sns-label">Instagram</div></a>
            <a href="https://x.com/kp_official0523" class="sns-item" target="_blank"><div class="sns-icon">X</div><div class="sns-label">X</div></a>
            <a href="https://www.tiktok.com/@kp_official_523" class="sns-item" target="_blank"><div class="sns-icon">TIKTOK</div><div class="sns-label">TikTok</div></a>
        </div>

        <div class="section-label">Featured Movie</div>
        <div class="featured-video" id="main-video"></div>
        <div class="section-label">New Arrivals</div>
        <div class="video-scroll" id="video-list"></div>
        <div class="section-label">Latest News</div>
        <div id="news-container"></div>
    </div>

    <script>
        async function loadData() {
            try {
                // 1. JSONデータの取得（タイムスタンプでキャッシュ回避）
                const res = await fetch('news.json?v=' + Date.now());
                const data = await res.json();
                
                // 2. ランダムフォトの表示
                if (data.images && data.images.length > 0) {
                    const randomIndex = Math.floor(Math.random() * data.images.length);
                    const photoEl = document.getElementById('random-photo');
                    photoEl.style.opacity = 0;
                    photoEl.src = data.images[randomIndex] + '?v=' + Date.now();
                    photoEl.onload = () => { photoEl.style.opacity = 1; };
                }

                // 3. 動画セクション
                const allVideos = [...(data.featured ? [data.featured] : []), ...(data.regulars || []), ...(data.shorts || [])];
                if(allVideos.length > 0) {
                    document.getElementById('main-video').innerHTML = `<div class="v-main"><iframe src="https://www.youtube.com/embed/${allVideos[0].id}" frameborder="0" allowfullscreen></iframe></div>`;
                    const list = document.getElementById('video-list');
                    list.innerHTML = "";
                    allVideos.slice(1).forEach(v => {
                        list.innerHTML += `<a href="https://www.youtube.com/watch?v=${v.id}" class="v-card" target="_blank"><img src="${v.thumbnail}" class="v-thumb"><div class="v-title">${v.title}</div></a>`;
                    });
                }

                // 4. ニュースセクション
                const container = document.getElementById('news-container');
                container.innerHTML = "";
                (data.news || []).forEach(item => {
                    container.innerHTML += `
                        <a href="${item.url}" class="news-card" target="_blank">
                            <img src="${item.img || ''}" class="news-img" loading="lazy">
                            <div class="news-content">
                                <div class="news-source">${item.source}</div>
                                <div class="news-title">${item.title}</div>
                            </div>
                        </a>`;
                });
            } catch (e) { console.error("Load Error:", e); }
        }

        // Pull-to-Refresh ロジック
        let startY = 0;
        const loader = document.getElementById('ptr-loader');
        window.addEventListener('touchstart', (e) => { if (window.scrollY === 0) startY = e.touches[0].pageY; }, { passive: true });
        window.addEventListener('touchmove', (e) => {
            const y = e.touches[0].pageY;
            const dist = y - startY;
            if (window.scrollY === 0 && dist > 0 && dist < 100) loader.style.height = dist + 'px';
        }, { passive: true });
        window.addEventListener('touchend', async (e) => {
            if (parseInt(loader.style.height) > 60) {
                loader.style.height = '40px';
                await loadData();
                setTimeout(() => { loader.style.height = '0'; }, 500);
            } else { loader.style.height = '0'; }
        }, { passive: true });

        // 初回読み込み実行
        loadData();
    </script>
</body>
</html>
