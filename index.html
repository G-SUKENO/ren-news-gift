<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="永瀬廉NEWS">
    <link rel="apple-touch-icon" href="icon.png">
    <title>永瀬廉NEWS</title>
    <style>
        :root {
            --main-bg: #0f0f0f;
            --card-bg: #1e1e1e;
            --accent-color: #d4af37;
            --text-color: #f5f5f5;
            --sub-text: #b0b0b0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--main-bg);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container { width: 100%; max-width: 500px; }
        h1 {
            font-size: 22px;
            text-align: center;
            color: var(--accent-color);
            margin-bottom: 20px;
            letter-spacing: 2px;
        }
        /* 検索窓のスタイル */
        .search-container {
            margin-bottom: 25px;
        }
        #search-bar {
            width: 100%;
            padding: 12px 15px;
            border-radius: 25px;
            border: 1px solid #444;
            background: #222;
            color: white;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
        }
        #search-bar:focus {
            border-color: var(--accent-color);
        }
        #news-list { display: grid; gap: 15px; }
        .news-item {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            border-left: 4px solid var(--accent-color);
        }
        .date {
            font-size: 11px;
            color: var(--accent-color);
            font-weight: bold;
            margin-bottom: 5px;
            display: block;
        }
        .news-item a {
            color: var(--text-color);
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🖤 永瀬廉 NEWS</h1>
        
        <div class="search-container">
            <input type="text" id="search-bar" placeholder="記事を検索...">
        </div>

        <div id="news-list">読み込み中...</div>
    </div>

    <script>
        let allNews = [];

        function renderNews(items) {
            const list = document.getElementById('news-list');
            list.innerHTML = '';
            items.forEach(item => {
                const div = document.createElement('div');
                div.className = 'news-item';
                div.innerHTML = `
                    <span class="date">${item.date}</span>
                    <a href="${item.url}" target="_blank">${item.title}</a>
                `;
                list.appendChild(div);
            });
            if(items.length === 0) {
                list.innerHTML = '<p style="text-align:center; color:#888;">見つかりませんでした</p>';
            }
        }

        fetch('news.json')
            .then(res => res.json())
            .then(data => {
                allNews = data;
                renderNews(allNews);
            });

        // 検索機能のロジック
        document.getElementById('search-bar').addEventListener('input', (e) => {
            const word = e.target.value.toLowerCase();
            const filtered = allNews.filter(n => n.title.toLowerCase().includes(word));
            renderNews(filtered);
        });
    </script>
</body>
</html>
