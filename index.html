<!DOCTYPE html>
<html lang="ja">
<head>
    <link rel="icon" href="images/photo_9.jpg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>REN NAGASE PORTAL</title>
    <style>
        :root { --bg-color: #000; --card-bg: #111; --accent-color: #d4af37; --text-color: #fff; }
        body { font-family: -apple-system, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 0; overflow-x: hidden; }
        .hero-section { width: 100%; height: 60vh; position: relative; overflow: hidden; }
        #random-photo { width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 1s ease; }
        .hero-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to bottom, rgba(0,0,0,0.4) 0%, transparent 40%, rgba(0,0,0,1) 100%); }
        header { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 100%; text-align: center; z-index: 10; }
        .subtitle { font-size: 0.6rem; color: var(--accent-color); letter-spacing: 0.4rem; text-transform: uppercase; margin-bottom: 8px; font-weight: bold; }
        h1 { margin: 0; font-size: 1.3rem; color: var(--accent-color); letter-spacing: 0.2rem; text-shadow: 2px 2px 10px rgba(0,0,0,0.8); }
        .content-wrap { position: relative; background: #000; z-index: 20; }
        .sns-hub { display: grid; padding: 25px 5px 10px; gap: 15px 0; grid-template-columns: repeat(3, 1fr); }
        @media (min-width: 601px) { .sns-hub { grid-template-columns: repeat(6, 1fr); } }
        .sns-item { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: #fff; }
        .sns-icon { width: 50px; height: 50px; border-radius: 50%; border: 1px solid var(--accent-color); display: flex; justify-content: center; align-items: center; font-size: 0.45rem; margin-bottom: 6px; color: var(--accent-color); background: var(--card-bg); font-weight: bold; }
        .sns-label { font-size: 0.55rem; font-weight: bold; }
        .section-label { padding: 40px 15px 15px; font-size: 0.8rem; color: var(--accent-color); font-weight: bold; text-transform: uppercase; text-align: center; letter-spacing: 0.2rem; }
        .v-container { padding: 0 15px; margin-bottom: 20px; }
        .scroll-x { display: flex; overflow-x: auto; padding: 10px 15px 30px; gap: 12px; scrollbar-width: none; -ms-overflow-style: none; }
        .scroll-x::-webkit-scrollbar { display: none; }
        footer { margin-top: 40px; padding: 30px 15px; border-top: 1px solid #222; text-align: center; }
    </style>
</head>
<body>
    <div class="hero-section">
        <header>
            <div class="subtitle">MIKU ONLY</div>
            <h1>REN NAGASE PORTAL</h1>
        </header>
        <img id="random-photo" src="">
        <div class="hero-overlay"></div>
    </div>
    <div class="content-wrap">
        <div class="sns-hub">
            <a href="https://www.universal-music.co.jp/king-and-prince/" class="sns-item" target="_blank"><div class="sns-icon">OFFICIAL</div><div class="sns-label">Official</div></a>
            <a href="https://starto.jp/s/p/artist/41" class="sns-item" target="_blank"><div class="sns-icon">START</div><div class="sns-label">Schedule</div></a>
            <a href="https://www.youtube.com/@kp_official_523" class="sns-item" target="_blank"><div class="sns-icon">YOUTUBE</div><div class="sns-label">YouTube</div></a>
            <a href="https://www.instagram.com/ren.nagase.official/" class="sns-item" target="_blank"><div class="sns-icon">INSTA</div><div class="sns-label">Instagram</div></a>
            <a href="https://x.com/kp_official0523" class="sns-item" target="_blank"><div class="sns-icon">X</div><div class="sns-label">X</div></a>
            <a href="https://www.tiktok.com/@kp_official_523" class="sns-item" target="_blank"><div class="sns-icon">TIKTOK</div><div class="sns-label">TikTok</div></a>
        </div>
        <div class="section-label">Featured Video</div>
        <div id="main-video" class="v-container"></div>
        <div class="section-label">Shorts</div>
        <div id="video-list" class="scroll-x"></div>
        <footer><p style="color: var(--accent-color); font-size: 0.7rem; letter-spacing: 0.1rem; margin: 0;">© 2026 REN NAGASE PORTAL</p></footer>
    </div>
</html>
