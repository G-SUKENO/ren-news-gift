<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>REN NAGASE PORTAL</title>
    <style>
        :root { --bg-color: #000; --card-bg: #111; --accent-color: #d4af37; --text-color: #fff; }
        body { font-family: -apple-system, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 0; overflow-x: hidden; overscroll-behavior-y: contain; }
        
        #ptr-loader { height: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; background: #000; transition: height 0.2s ease; }
        .spinner { width: 22px; height: 22px; border: 2px solid rgba(212, 175, 55, 0.3); border-top: 2px solid var(--accent-color); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* 全画面ヒーローセクション */
        .hero-section { width: 100%; height: 70vh; position: relative; overflow: hidden; }
        #random-photo { width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 1s ease; }
        .hero-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to bottom, rgba(0,0,0,0.5) 0%, transparent 40%, rgba(0,0,0,1) 100%); }
        
        header { position: absolute; top: 40px; width: 100%; text-align: center; z-index: 10; }
        .subtitle { font-size: 0.6rem; color: var(--accent-color); letter-spacing: 0.4rem; text-transform: uppercase; margin-bottom: 8px; font-weight: bold; }
        h1 { margin: 0; font-size: 1.3rem; color: var(--accent-color); letter-spacing: 0.2rem; }

        /* コンテンツエリア */
        .content-wrap { position: relative; margin-top: -20px; background: #000; border-radius: 20px 20px 0 0; z-index: 20; padding-bottom: 50px; }

        .sns-hub { display: grid; padding: 25px 5px; gap: 15px 0; border-bottom: 1px solid #222; }
        @media (max-width: 600px) { .sns-hub { grid-template-columns: repeat(3, 1fr); } }
        @media (min-width: 601px) { .sns-hub { grid-template-columns: repeat(6, 1fr); } }

        .sns-item { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: #fff; }
        .sns-icon { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--accent-color); display: flex; justify-content: center; align-items: center; font-size: 0.5rem; margin-bottom: 6px; color: var(--accent-color); background: var(--card-bg); }
        .sns-label { font-size: 0.55rem; font-weight: bold; }

        .section-label { padding: 25px 15px 10px; font-size: 0.75rem; color: var(--accent-color); font-weight: bold; border-left: 3px solid var(--accent-color); margin-left: 15px; text-transform: uppercase; }
        
        #news-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; padding: 12px; }
        .news-card { background: var(--card-bg); border-radius: 12px; overflow: hidden; text-decoration: none; color: inherit; border: 1px solid #222; transition: transform 0.2s; }
        .news-content { padding: 12px; }
        .news-source { font-size: 0.6rem; color: var(--accent-color); font-weight: bold; margin-bottom: 6px; }
        .news-title { font-size: 0.8rem; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

        .video-scroll { display: flex; overflow-x: auto; padding: 10px 15px; gap: 12px; }
        .video-scroll::-webkit-scrollbar { display: none; }
        .v-card { min-width: 160px; text-decoration: none; color: #fff; }
        .v-thumb { width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 8px; }
    </style>
</head>
<body>
    <div id="ptr-loader"><div class="spinner"></div></div>

    <div class="hero-section">
        <header>
            <div class="subtitle">T.Miku Only</div>
            <h1>REN NAGASE PORTAL</h1>
        </header>
        <img id="random-photo" src="">
        <div class="hero-overlay"></div>
    </div>

    <div class="content-wrap">
        <div class="sns-hub">
            <a href="https://www.universal-music.co.jp/king-and-prince/" class="sns-item" target="_blank"><div class="sns-icon">OFFICIAL</div><div class="sns-label">Official</div></a>
            <a href="https://starto.jp/s/p/artist/41" class="sns-item" target="_blank"><div class="sns-icon">START</div><div class="sns-label">Schedule</div></a>
            <a href="https://www.youtube.com/@kp_official_523" class="sns-item" target="_blank"><div class="sns-icon">YOUTUBE</div><div class="sns-label">YouTube</div></a>
            <a href="https://www.instagram.com/ren.nagase.official/" class="sns-item" target="_blank"><div class="sns-icon">INSTA</div><div class="sns-label">Instagram</div></a>
            <a href="https://x.com/kp_official0523" class="sns-item" target="_blank"><div class="sns-icon">X</div><div class="sns-label">X</div></a>
            <a href="https://www.tiktok.com/@kp_official_523" class="sns-item" target="_blank"><div class="sns-icon">TIKTOK</div><div class="sns-label">TikTok</div></a>
        </div>

        <div class="section-label">Latest News</div>
        <div id="news-container"></div>

        <div class="section-label">Official YouTube</div>
        <div class="video-scroll" id="video-list"></div>
    </div>

    <script>
        async function updateUI() {
            try {
                const res = await fetch('news.json?v=' + Date.now());
                const data = await res.json();
                
                // 1. ランダム画像
                if (data.images && data.images.length > 0) {
                    const img = document.getElementById('random-photo');
                    img.style.opacity = 0;
                    img.src = data.images[Math.floor(Math.random() * data.images.length)] + '?v=' + Date.now();
                    img.onload = () => img.style.opacity = 1;
                }

                // 2. ニュース
                const newsCont = document.getElementById('news-container');
                newsCont.innerHTML = "";
                if (data.news && data.news.length > 0) {
                    data.news.forEach(n => {
                        newsCont.innerHTML += `
                            <a href="${n.url}" class="news-card" target="_blank">
                                <div class="news-content">
                                    <div class="news-source">${n.source}</div>
                                    <div class="news-title">${n.title}</div>
                                </div>
                            </a>`;
                    });
                } else {
                    newsCont.innerHTML = "<p style='padding:20px; color:#888;'>現在、新しいニュースはありません。</p>";
                }

                // 3. 動画
                const videoCont = document.getElementById('video-list');
                videoCont.innerHTML = "";
                const videos = [...(data.featured ? [data.featured] : []), ...(data.regulars || [])];
                videos.forEach(v => {
                    videoCont.innerHTML += `
                        <a href="https://www.youtube.com/watch?v=${v.id}" class="v-card" target="_blank">
                            <img src="${v.thumbnail}" class="v-thumb">
                            <div style="font-size:0.6rem; margin-top:5px;">${v.title}</div>
                        </a>`;
                });

            } catch (e) { console.error("Update UI Error:", e); }
        }

        // Pull-to-Refresh ロジック
        let startY = 0;
        const loader = document.getElementById('ptr-loader');
        window.addEventListener('touchstart', e => { if(window.scrollY === 0) startY = e.touches[0].pageY; }, {passive:true});
        window.addEventListener('touchmove', e => {
            const dist = e.touches[0].pageY - startY;
            if(window.scrollY === 0 && dist > 0 && dist < 100) loader.style.height = dist + 'px';
        }, {passive:true});
        window.addEventListener('touchend', async () => {
            if(parseInt(loader.style.height) > 60) {
                loader.style.height = '40px';
                await updateUI();
                setTimeout(() => loader.style.height = '0', 500);
            } else { loader.style.height = '0'; }
        }, {passive:true});

        updateUI();
    </script>
</body>
</html>
