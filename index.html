<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>REN NAGASE PORTAL</title>
    <style>
        :root {
            --bg-color: #000000; /* 漆黒 */
            --card-bg: #111111;
            --accent-color: #d4af37; /* ゴールド */
            --text-color: #ffffff;
            --text-muted: #888888;
        }
        body {
            font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            user-select: none;
        }
        header {
            padding: 20px 15px 10px;
            text-align: center;
            border-bottom: 1px solid #222;
        }
        h1 {
            margin: 0;
            font-size: 1.1rem;
            letter-spacing: 0.2rem;
            color: var(--accent-color);
        }

        /* SNSハブのレイアウト */
        .sns-hub {
            display: flex;
            justify-content: space-around;
            padding: 20px 10px;
            background: linear-gradient(180deg, #000, #0a0a0a);
            border-bottom: 1px solid #222;
        }
        .sns-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: var(--text-color);
            flex: 1;
        }
        .sns-icon {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--card-bg);
            border: 1px solid var(--accent-color);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.7rem;
            margin-bottom: 8px;
            font-weight: bold;
            color: var(--accent-color);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
        }
        .sns-label {
            font-size: 0.65rem;
            font-weight: bold;
        }

        /* カテゴリラベル */
        .section-label {
            padding: 15px 15px 5px;
            font-size: 0.75rem;
            color: var(--accent-color);
            font-weight: bold;
            text-transform: uppercase;
        }

        /* ニュースリスト */
        #news-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 12px;
            padding: 12px;
        }
        .news-card {
            background: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            border: 1px solid #222;
        }
        /* 公式ニュースには特別な縁取りを */
        .news-card[data-source*="公式"] {
            border: 1px solid var(--accent-color);
        }
        .news-img {
            width: 100%;
            aspect-ratio: 16/10;
            object-fit: cover;
            background-color: #222;
        }
        .news-content {
            padding: 10px;
        }
        .news-source {
            font-size: 0.6rem;
            color: var(--accent-color);
            margin-bottom: 4px;
            font-weight: bold;
        }
        .news-title {
            font-size: 0.8rem;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <header><h1>REN NAGASE</h1></header>

    <div class="section-label">Official SNS / Blog</div>
    <div class="sns-hub">
        <a href="https://www.instagram.com/ren.nagase.official/" class="sns-item" target="_blank">
            <div class="sns-icon">INSTA</div>
            <div class="sns-label">Instagram</div>
        </a>
        <a href="https://starto.jp/s/p/artist/41" class="sns-item" target="_blank">
            <div class="sns-icon">START</div>
            <div class="sns-label">Schedule</div>
        </a>
        <a href="https://www.universal-music.co.jp/king-and-prince/" class="sns-item" target="_blank">
            <div class="sns-icon">UMJ</div>
            <div class="sns-label">Official</div>
        </a>
        <a href="https://www.tiktok.com/@kp_official_523" class="sns-item" target="_blank">
            <div class="sns-icon">TIKTOK</div>
            <div class="sns-label">TikTok</div>
        </a>
    </div>

    <div class="section-label">Latest News</div>
    <div id="news-container"></div>

    <script>
        async function loadNews() {
            try {
                const res = await fetch('news.json?v=' + Date.now());
                const data = await res.json();
                const container = document.getElementById('news-container');
                
                data.forEach(item => {
                    const card = document.createElement('a');
                    card.className = 'news-card';
                    card.href = item.url;
                    card.target = '_blank';
                    card.setAttribute('data-source', item.source);
                    
                    card.innerHTML = `
                        <img src="${item.img || 'https://via.placeholder.com/400x250/111/d4af37?text=No+Image'}" class="news-img" loading="lazy">
                        <div class="news-content">
                            <div class="news-source">${item.source}</div>
                            <div class="news-title">${item.title}</div>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (e) {
                console.error("Load failed", e);
            }
        }
        loadNews();
    </script>
</body>
</html>
