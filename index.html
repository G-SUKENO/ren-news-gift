<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>REN NAGASE PORTAL</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #111111;
            --accent-color: #d4af37; /* ゴールド */
            --text-color: #ffffff;
        }
        body {
            font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0; padding: 0;
            overflow-x: hidden;
        }
        header { padding: 20px 15px 10px; text-align: center; border-bottom: 1px solid #222; }
        h1 { margin: 0; font-size: 1.1rem; letter-spacing: 0.2rem; color: var(--accent-color); }

        /* SNSハブ：5つ並んでもスマホで収まるよう調整 */
        .sns-hub { 
            display: flex; 
            justify-content: space-around; /* 均等に配置 */
            padding: 15px 5px; 
            border-bottom: 1px solid #222; 
        }
        .sns-item { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            text-decoration: none; 
            color: var(--text-color); 
            width: 18%; /* 5つ並べるために幅を制限 */
        }
        .sns-icon { 
            width: 44px; height: 44px; /* スマホ向けにわずかにサイズダウン */
            border-radius: 50%; 
            background: var(--card-bg); 
            border: 1px solid var(--accent-color); 
            display: flex; justify-content: center; align-items: center; 
            font-size: 0.5rem; margin-bottom: 6px; 
            font-weight: bold; color: var(--accent-color); 
            box-shadow: 0 0 8px rgba(212, 175, 55, 0.1);
        }
        .sns-label { font-size: 0.55rem; font-weight: bold; white-space: nowrap; }

        .video-section { padding: 15px; background: #050505; }
        .video-wrapper { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 12px; border: 1px solid #333; }
        .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

        .section-label { padding: 15px 15px 5px; font-size: 0.75rem; color: var(--accent-color); font-weight: bold; text-transform: uppercase; border-left: 3px solid var(--accent-color); margin: 10px 0 0 15px; }

        #news-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; padding: 12px; }
        .news-card { background: var(--card-bg); border-radius: 10px; overflow: hidden; text-decoration: none; color: inherit; display: flex; flex-direction: column; border: 1px solid #222; }
        .news-card[data-source*="公式"] { border: 1px solid var(--accent-color); }
        .news-img { width: 100%; aspect-ratio: 16/10; object-fit: cover; background-color: #222; }

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <style>
        :root {
            --bg-color: #000000;

        }
        header { padding: 20px 15px 10px; text-align: center; border-bottom: 1px solid #222; }
        h1 { margin: 0; font-size: 1.1rem; letter-spacing: 0.2rem; color: var(--accent-color); }

        /* SNSハブ：5つ並んでもスマホで収まるよう調整 */
        .sns-hub { 
            display: flex; 
            justify-content: space-around; /* 均等に配置 */
            padding: 15px 5px; 
            border-bottom: 1px solid #222; 
        }
        .sns-item { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            text-decoration: none; 
            color: var(--text-color); 
            width: 18%; /* 5つ並べるために幅を制限 */
        }
        .sns-icon { 
            width: 44px; height: 44px; /* スマホ向けにわずかにサイズダウン */
            border-radius: 50%; 
            background: var(--card-bg); 
            border: 1px solid var(--accent-color); 
            display: flex; justify-content: center; align-items: center; 
            font-size: 0.5rem; margin-bottom: 6px; 
            font-weight: bold; color: var(--accent-color); 
            box-shadow: 0 0 8px rgba(212, 175, 55, 0.1);
        }
        .sns-label { font-size: 0.55rem; font-weight: bold; white-space: nowrap; }

        .video-section { padding: 15px; background: #050505; }
        .video-wrapper { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 12px; border: 1px solid #333; }
        .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

        .section-label { padding: 15px 15px 5px; font-size: 0.75rem; color: var(--accent-color); font-weight: bold; text-transform: uppercase; border-left: 3px solid var(--accent-color); margin: 10px 0 0 15px; }

        .news-source { font-size: 0.6rem; color: var(--accent-color); margin-bottom: 4px; font-weight: bold; }
        .news-title { font-size: 0.8rem; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    </style>
</head>
<body>
    <header><h1>REN NAGASE PORTAL</h1></header>

    <div class="sns-hub">
        <a href="https://www.instagram.com/ren.nagase.official/" class="sns-item" target="_blank">
            <div class="sns-icon">INSTA</div><div class="sns-label">Instagram</div>
        </a>
        <a href="https://www.tiktok.com/@kp_official_523" class="sns-item" target="_blank">
            <div class="sns-icon">TIKTOK</div><div class="sns-label">TikTok</div>
        </a>
        <a href="https://www.youtube.com/@kp_official_523" class="sns-item" target="_blank">
            <div class="sns-icon">YOUTUBE</div><div class="sns-label">YouTube</div>
        </a>
        <a href="https://starto.jp/s/p/artist/41" class="sns-item" target="_blank">
            <div class="sns-icon">START</div><div class="sns-label">Schedule</div>
        </a>
        <a href="https://www.universal-music.co.jp/king-and-prince/" class="sns-item" target="_blank">
            <div class="sns-icon">UMJ</div><div class="sns-label">Official</div>
        </a>
    </div>

    <div class="section-label">Featured Movie</div>
    <div class="video-section">
        <div class="video-wrapper">
            <iframe src="https://www.youtube.com/embed/miF9eiOuiGo" frameborder="0" allowfullscreen></iframe>
        </div>
    </div>

    <div class="section-label">Latest News</div>
    <div id="news-container"></div>

    <script>
        async function loadNews() {
            try {
                const res = await fetch('news.json?v=' + Date.now());
                const data = await res.json();
                const container = document.getElementById('news-container');
                data.forEach(item => {
                    const card = document.createElement('a');
                    card.className = 'news-card';
                    card.href = item.url; card.target = '_blank';
                    card.setAttribute('data-source', item.source);
                    card.innerHTML = `
                        <img src="${item.img || 'https://via.placeholder.com/400x250/111/d4af37?text=No+Image'}" class="news-img" loading="lazy">
                        <div class="news-content">
                            <div class="news-source">${item.source}</div>
                            <div class="news-title">${item.title}</div>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (e) { console.error(e); }
        }
        loadNews();
    </script>
</body>
</html>
