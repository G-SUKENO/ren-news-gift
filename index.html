    <style>
        :root { --gold: #d4af37; --black: #000; --dark-grey: #1a1a1a; }

        #hero-container { position: relative; width: 100%; height: 80vh; background-color: var(--black); overflow: hidden; }
        @media (max-width: 768px) { #hero-container { height: 65vh; } }
        .hero-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-size: cover; background-position: center top; transition: opacity 2.5s ease-in-out; opacity: 0; z-index: 0; }
        .hero-layer.active { opacity: 1; z-index: 1; }
        .hero-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to bottom, transparent 40%, rgba(0,0,0,0.7) 80%, var(--black) 100%); z-index: 2; }
        .hero-header { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 3; text-align: center; width: 90%; }
        .hero-title { color: var(--gold); font-size: 1.8rem; font-weight: 300; letter-spacing: 0.4em; margin: 0; text-shadow: 0 2px 15px rgba(0,0,0,0.8); white-space: nowrap; }
        .hero-subtitle { color: #ffffff; font-size: 0.75rem; font-weight: 200; letter-spacing: 0.6em; margin-top: 15px; opacity: 0.85; text-transform: uppercase; }
        @media (max-width: 768px) { .hero-title { font-size: 1.15rem; letter-spacing: 0.25em; } .hero-subtitle { font-size: 0.55rem; letter-spacing: 0.35em; } }
        
        
        .nav-icons { display: flex; justify-content: center; gap: 30px; padding: 85px 20px 40px; position: relative; z-index: 3; flex-wrap: wrap; background: var(--black); }
        @media (max-width: 768px) {
            .nav-icons { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px 0; padding: 60px 10px 30px; }
            .nav-item { grid-column: span 1; }
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: var(--gold); transition: 0.4s; }
        .nav-item svg { width: 28px; height: 28px; fill: none; stroke: var(--gold); stroke-width: 1.2; margin-bottom: 10px; }
        .nav-item span { font-size: 0.65rem; letter-spacing: 2px; text-transform: uppercase; font-weight: 300; }

        .nav-item { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: var(--gold); transition: 0.4s; }
        .nav-item svg { width: 28px; height: 28px; fill: none; stroke: var(--gold); stroke-width: 1.2; margin-bottom: 10px; }
        .nav-item span { font-size: 0.65rem; letter-spacing: 2px; text-transform: uppercase; font-weight: 300; }
        
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px 60px; }
        .section-title { font-size: 1.15rem; letter-spacing: 4px; border-left: 1px solid var(--gold); padding-left: 20px; margin: 60px 0 40px; color: var(--gold); font-weight: 200; }
        .news-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 35px; }
        .news-item { background: #080808; border: 1px solid var(--dark-grey); text-decoration: none; color: inherit; display: flex; flex-direction: column; transition: 0.4s; }
        .news-item:hover { border-color: var(--gold); }
        .news-thumb { width: 100%; height: 210px; object-fit: cover; opacity: 0.8; }
        .news-content { padding: 25px; flex-grow: 1; }
        .news-title { font-size: 0.95rem; line-height: 1.7; font-weight: 300; }
        .news-meta { font-size: 0.7rem; color: #666; margin-bottom: 10px; }

        .x-wrapper { border: 1px solid var(--dark-grey); background: var(--black); min-height: 600px; }
        
        footer { background-color: var(--black); padding: 80px 20px; text-align: center; border-top: 1px solid var(--dark-grey); }
        .footer-line { width: 40px; height: 1px; background-color: var(--gold); margin: 0 auto 30px; opacity: 0.5; }
        .footer-text { color: #444; font-size: 0.7rem; letter-spacing: 3px; text-transform: uppercase; }
        .footer-brand { color: var(--gold); font-size: 0.6rem; letter-spacing: 5px; margin-top: 15px; opacity: 0.6; }
    </style>

<div class="container">
    <section id="exclusive-news">
        <h2 class="section-title">EXCLUSIVE NEWS FEED</h2>
        <div id="news-list" class="news-grid">
            <p style="color:#444; letter-spacing:2px; font-size:0.8rem;">LOADING LATEST NEWS...</p>
        </div>

    <div class="footer-text">&copy; 2026 REN NAGASE PRIVATE PORTAL</div>
    <div class="footer-brand">FOR MIKU ONLY</div>
</footer>

<script>
    fetch('image_list.json').then(res => res.json()).then(images => {
        if (!images || images.length === 0) return;
        
        // ★ 開始インデックスをランダムにする
        let idx = Math.floor(Math.random() * images.length);
        
        let activeLayer = 1;
        const layer1 = document.getElementById('hero-layer-1');
        const layer2 = document.getElementById('hero-layer-2');
        
        layer1.style.backgroundImage = `url('${images[idx]}')`;
        
        const update = () => {
            idx = (idx + 1) % images.length;
            if (activeLayer === 1) {
                layer2.style.backgroundImage = `url('${images[idx]}')`;
                layer2.classList.add('active'); layer1.classList.remove('active');
                activeLayer = 2;
            } else {
                layer1.style.backgroundImage = `url('${images[idx]}')`;
                layer1.classList.add('active'); layer2.classList.remove('active');
                activeLayer = 1;
            }
        };
        if(images.length > 1) { setInterval(update, 5000); }
    }).catch(e => console.log("Image list error"));

    fetch('news_list.json').then(res => res.json()).then(data => {
        const container = document.getElementById('news-list');
        if (data.length > 0) container.innerHTML = '';
        data.forEach(item => {
            const a = document.createElement('a');
            a.className = 'news-item'; a.href = item.link; a.target = '_blank';
            a.innerHTML = `<img src="${item.thumbnail}" class="news-thumb"><div class="news-content"><div class="news-meta">${item.date} | ${item.site_name}</div><div class="news-title">${item.title}</div></div>`;
            container.appendChild(a);
        });
    }).catch(e => console.log("News not found"));
</script>
