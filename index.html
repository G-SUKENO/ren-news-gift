<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>廉くんNEWS</title>
    <style>
        :root {
            --bg-color: #0a0a0a; /* 漆黒 */
            --card-bg: #1a1a1a;
            --accent-color: #d4af37; /* ゴールド */
            --text-color: #ffffff;
            --text-muted: #a0a0a0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        header {
            background-color: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #333;
            z-index: 100;
        }
        h1 {
            margin: 0;
            font-size: 1.2rem;
            letter-spacing: 0.1rem;
            color: var(--accent-color);
            text-transform: uppercase;
        }
        #news-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
            padding: 15px;
        }
        .news-card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s;
        }
        .news-card:active {
            transform: scale(0.97);
        }
        .news-img {
            width: 100%;
            aspect-ratio: 1/1;
            object-fit: cover;
            background-color: #333;
        }
        .news-content {
            padding: 10px;
        }
        .news-source {
            font-size: 0.65rem;
            color: var(--accent-color);
            font-weight: bold;
            margin-bottom: 5px;
            text-transform: uppercase;
        }
        .news-title {
            font-size: 0.85rem;
            line-height: 1.4;
            font-weight: 500;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .news-date {
            font-size: 0.65rem;
            color: var(--text-muted);
            margin-top: 8px;
        }
        .new-badge {
            background-color: var(--accent-color);
            color: #000;
            font-size: 0.6rem;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
            margin-left: 5px;
        }
    </style>
</head>
<body>
    <header><h1>Ren Nagase Daily</h1></header>
    <div id="news-container"></div>

    <script>
        async function loadNews() {
            try {
                const res = await fetch('news.json?v=' + Date.now());
                const data = await res.json();
                const container = document.getElementById('news-container');
                
                data.forEach(item => {
                    const card = document.createElement('a');
                    card.className = 'news-card';
                    card.href = item.url;
                    card.target = '_blank';
                    
                    const isNew = item.date === new Date().toLocaleDateString('ja-JP', {year:'numeric',month:'2-digit',day:'2-digit'}).replace(/\//g, '/');
                    
                    card.innerHTML = `
                        <img src="${item.img || 'https://via.placeholder.com/400?text=★'}" class="news-img" loading="lazy">
                        <div class="news-content">
                            <div class="news-source">${item.source}${isNew ? '<span class="new-badge">NEW</span>' : ''}</div>
                            <div class="news-title">${item.title}</div>
                            <div class="news-date">${item.date}</div>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (e) {
                console.error("Failed to load news", e);
            }
        }
        loadNews();
    </script>
</body>
</html>
