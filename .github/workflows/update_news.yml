name: Auto News Update

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  update-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run update scripts
        run: |
          chmod +x update_news.sh
          ./update_news.sh
          # ここで247枚のリストを再生成させる
          python3 generate_image_list.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # news.json と image_list.json の両方を保存対象にする
          git add news.json image_list.json
          git commit -m "Auto-update news and image list: $(date)" || echo "No changes to commit"
          git push
